# Render Blueprint for the production-ready Part 6 agent.
# If the repository root is connected, select this Blueprint file and keep the
# service rootDir below pointed at this folder.
services:
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "10.0"
